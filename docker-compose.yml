name: url-shortener-new
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: url_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./url_shortener_backend
    volumes:
      - ./url_shortener_backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@postgres/url_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - API_BASE_URL=${API_BASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./flutter_app/flutter_app
      args:
        - API_BASE_URL=${API_BASE_URL}
    ports:
      - "8080:8080"
    depends_on:
      - backend

  worker:
    build: ./url_shortener_backend
    command: python -m poetry run celery -A celery_worker.celery_app worker --loglevel=info
    volumes:
      - ./url_shortener_backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql://user:password@postgres/url_db
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=${API_BASE_URL}
    depends_on:
      - redis
      - postgres

  nginx:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: url_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./url_shortener_backend
    ports:
      - "8000:8000"
    volumes:
      - ./url_shortener_backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql://user:password@postgres/url_db
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./flutter_app/flutter_app
    ports:
      - "8080:8080"
    depends_on:
      - backend

  worker:
    build: ./url_shortener_backend
    command: python -m poetry run celery -A celery_worker.celery_app worker --loglevel=info
    volumes:
      - ./url_shortener_backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql://user:password@postgres/url_db
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:

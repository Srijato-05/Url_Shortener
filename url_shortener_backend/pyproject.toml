[tool.poetry]
package-mode = false

[project]
name = "url-shortener-backend"
version = "0.1.0"
description = "URL Shortener Backend with FastAPI"
authors = [
    {name = "User"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.0,<0.137.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pydantic (>=2.13.2,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.26,<0.0.27)",
    "user-agents (>=2.2.0,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "bcrypt < 4.0.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

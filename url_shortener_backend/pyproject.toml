[tool.poetry]
package-mode = false

[project]
name = "url-shortener-backend"
version = "0.1.0"
description = "URL Shortener Backend with FastAPI"
authors = [
    {name = "User"}
]
readme = "README.md"
[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.136.0"
uvicorn = "^0.44.0"
sqlalchemy = "^2.0.49"
psycopg2-binary = "^2.9.11"
pydantic = "^2.13.2"
redis = "^7.4.0"
celery = "^5.6.3"
python-multipart = "^0.0.26"
user-agents = "^2.2.0"
qrcode = "^8.0.0"
pillow = "^11.1.0"
email-validator = "^2.3.0"
bcrypt = "<4.0.0"
beautifulsoup4 = "^4.12.0"
requests = "^2.31.0"
pytest = "^8.2.0"
httpx = "^0.27.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
